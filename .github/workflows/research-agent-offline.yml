name: Research Agent offline tests

on:
  pull_request:
    paths:
      - 'rag/research_agent/**'
      - 'rag/research_tools/**'
      - 'tests/test_research_agent.py'
      - 'tests/test_spectroscopy.py'
      - 'tests/test_presentation.py'
      - 'tests/test_slide_planner.py'
      - 'tests/test_research_tools_integration.py'
      - 'requirements-research-tools.txt'
      - '.github/workflows/research-agent-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional slide plotting packages
        run: python -m pip install -r requirements-research-tools.txt
      - name: Compile new modules
        run: python -m compileall -q rag/research_agent rag/research_tools tests/test_research_agent.py tests/test_spectroscopy.py tests/test_presentation.py tests/test_slide_planner.py tests/test_research_tools_integration.py
      - name: Run isolated unit tests
        run: |
          python -m unittest discover -s tests -p 'test_research_agent.py' -v
          python -m unittest discover -s tests -p 'test_spectroscopy.py' -v
          python -m unittest discover -s tests -p 'test_presentation.py' -v
          python -m unittest discover -s tests -p 'test_slide_planner.py' -v
          python -m unittest discover -s tests -p 'test_research_tools_integration.py' -v
